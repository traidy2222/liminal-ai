name: liminal_desktop
description: "Liminal — the native desktop app for the Liminal agent harness."
publish_to: "none"
version: 0.1.2

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  web_socket_channel: ^3.0.0
  path: ^1.9.0
  provider: ^6.1.2
  go_router: ^14.6.2
  flutter_markdown: ^0.7.4+1
  markdown: ^7.3.1
  flutter_widget_from_html: ^0.15.2
  fwfh_url_launcher: ^0.9.1
  webview_flutter: ^4.10.0
  webview_flutter_wkwebview: ^3.16.0
  webview_win_floating: ^3.0.3
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  url_launcher: ^6.3.1
  html: ^0.15.5
  file_picker: ^8.1.6
  pasteboard: ^0.5.0
  mime: ^2.0.0
  record: ^5.2.1
  just_audio: ^0.9.42
  permission_handler: ^11.3.1
  path_provider: ^2.1.5
  package_info_plus: ^8.1.2
  archive: ^4.0.2
  http: ^1.2.2
  crypto: ^3.0.6
  just_audio_media_kit: ^2.1.0
  media_kit_libs_windows_audio: ^1.0.9
  media_kit_libs_linux: ^1.2.1
  desktop_multi_window: ^0.3.0
  desktop_drop: ^0.5.0
  window_manager: ^0.4.3
  screen_retriever: ^0.2.0
  image: ^4.5.4
  liminal_remote_desktop:
    path: packages/liminal_remote_desktop
  sentry_flutter: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# record 5.2.x + record_linux 0.7.x mismatch on record_platform_interface 1.6
dependency_overrides:
  record_linux: ^1.2.2

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
