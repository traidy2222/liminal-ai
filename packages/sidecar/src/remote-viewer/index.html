<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Liminal Remote</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #05080c; color: #dde8f0; font-family: system-ui, sans-serif; overflow: hidden; }
    #status {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      padding: 8px 12px; font-size: 12px; color: #8aa0b4;
      background: linear-gradient(#0a0e14ee, #0a0e1400);
      pointer-events: none;
    }
    #pane {
      width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center;
      touch-action: none; cursor: crosshair;
    }
    #mirror {
      max-width: 100%; max-height: 100%; object-fit: contain; user-select: none;
      -webkit-user-drag: none;
    }
    #error { position: fixed; bottom: 12px; left: 12px; right: 12px; color: #f07178; font-size: 13px; }
  </style>
</head>
<body>
  <div id="status">Connecting…</div>
  <div id="pane">
    <img id="mirror" alt="Liminal app mirror" draggable="false" />
  </div>
  <div id="error" hidden></div>
  <script>
    const params = new URLSearchParams(location.search);
    const code = params.get("code") || "";
    const statusEl = document.getElementById("status");
    const pane = document.getElementById("pane");
    const mirror = document.getElementById("mirror");
    const errorEl = document.getElementById("error");
    let role = "view", joinToken = "", viewportW = 1280, viewportH = 720, ws = null, objectUrl = null;

    function mapToViewport(clientX, clientY) {
      const rect = pane.getBoundingClientRect();
      const scale = Math.min(rect.width / viewportW, rect.height / viewportH);
      const drawW = viewportW * scale;
      const drawH = viewportH * scale;
      const offsetX = rect.left + (rect.width - drawW) / 2;
      const offsetY = rect.top + (rect.height - drawH) / 2;
      if (clientX < offsetX || clientY < offsetY || clientX > offsetX + drawW || clientY > offsetY + drawH) return null;
      return {
        x: Math.round(((clientX - offsetX) / drawW) * viewportW),
        y: Math.round(((clientY - offsetY) / drawH) * viewportH),
      };
    }

    function sendInput(payload) {
      if (!ws || ws.readyState !== WebSocket.OPEN || role !== "control") return;
      ws.send(JSON.stringify(payload));
    }

    function showFrame(buf) {
      const blob = new Blob([buf], { type: "image/jpeg" });
      const next = URL.createObjectURL(blob);
      mirror.src = next;
      if (objectUrl) URL.revokeObjectURL(objectUrl);
      objectUrl = next;
      statusEl.textContent = "Live (" + role + ")";
    }

    fetch("/remote/resolve?code=" + encodeURIComponent(code))
      .then((r) => r.json())
      .then((cfg) => {
        if (!cfg.ok) throw new Error(cfg.error || "resolve failed");
        role = cfg.role || "view";
        joinToken = cfg.joinToken;
        viewportW = cfg.viewportWidth || 1280;
        viewportH = cfg.viewportHeight || 720;
        const proto = location.protocol === "https:" ? "wss:" : "ws:";
        const uiPath = cfg.uiStreamUrl || "/remote/ui/stream?join=" + encodeURIComponent(joinToken);
        ws = new WebSocket(proto + "//" + location.host + uiPath);
        ws.binaryType = "arraybuffer";
        ws.onopen = () => { statusEl.textContent = "Connected (" + role + ") — waiting for frames…"; };
        ws.onmessage = (ev) => {
          if (typeof ev.data === "string") {
            try {
              const meta = JSON.parse(ev.data);
              if (meta.type === "meta") {
                viewportW = meta.width || viewportW;
                viewportH = meta.height || viewportH;
                if (meta.title) statusEl.textContent = "Live: " + meta.title + " (" + role + ")";
              }
            } catch (_) {}
            return;
          }
          if (ev.data instanceof ArrayBuffer && ev.data.byteLength > 64) showFrame(ev.data);
        };
        ws.onerror = () => { errorEl.hidden = false; errorEl.textContent = "UI stream error"; };
        ws.onclose = () => { statusEl.textContent = "Disconnected"; };
      })
      .catch((e) => {
        statusEl.textContent = "Error";
        errorEl.hidden = false;
        errorEl.textContent = e.message;
      });

    pane.addEventListener("pointerdown", (ev) => {
      if (role !== "control") return;
      const pt = mapToViewport(ev.clientX, ev.clientY);
      if (!pt || ev.button !== 0) return;
      sendInput({ type: "click", x: pt.x, y: pt.y, button: "left" });
    });
    pane.addEventListener("wheel", (ev) => {
      if (role !== "control") return;
      ev.preventDefault();
      const pt = mapToViewport(ev.clientX, ev.clientY);
      if (!pt) return;
      sendInput({ type: "wheel", x: pt.x, y: pt.y, deltaX: ev.deltaX, deltaY: ev.deltaY });
    }, { passive: false });
    window.addEventListener("keydown", (ev) => {
      if (role !== "control" || ev.target !== document.body) return;
      if (ev.key.length === 1) sendInput({ type: "type", text: ev.key });
      else sendInput({ type: "keydown", key: ev.key });
    });
  </script>
</body>
</html>
