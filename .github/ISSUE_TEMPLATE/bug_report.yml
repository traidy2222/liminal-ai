name: Bug report
description: Something broke in the harness, TUI, or web UI
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Check [troubleshooting](https://docs.vireondynamics.com/liminal/operations/troubleshooting) and run `liminal doctor` first.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Expected vs actual behavior
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. liminal web
        2. Ask agent to ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Liminal version or commit
      placeholder: e.g. v0.0.17 or git sha
  - type: dropdown
    id: ui
    attributes:
      label: UI
      options:
        - Web
        - TUI
        - Both
        - N/A (core/tools only)
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: e.g. Windows 11, macOS 15, Ubuntu 24.04
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or harness trace
      description: Redact API keys and paths if needed
