name: android-mobile

on:
  push:
    paths:
      - "apps/android/**"
      - "docs/mobile/**"
  pull_request:
    paths:
      - "apps/android/**"

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Verify Android project
        working-directory: apps/android
        run: gradle :app:tasks --all
