name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build compiled packages
        run: |
          npm run build -w @liminal/core
          npm run build -w @liminal/protocol
          npm run build -w @liminal/tools
          npm run build -w @liminal/sidecar

      - name: Typecheck compiled workspaces
        run: |
          npm run typecheck -w @liminal/core
          npm run typecheck -w @liminal/tools
          npm run typecheck -w @liminal/sidecar
          npm run typecheck -w @liminal/protocol
          npm run typecheck -w @liminal/tui
          npm run typecheck -w @liminal/web

  test-core:
    name: Test packages/core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build core
        run: npm run build -w @liminal/core

      - name: Run tests
        run: npm run test -w @liminal/core

  verify-harness-defaults:
    name: Verify harness defaults
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build core
        run: npm run build -w @liminal/core

      - name: Verify no secrets in defaults
        run: npm run verify-harness-defaults-no-secrets
