name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test-web-node24:
    name: Public web transport on Node 24
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build -w @liminal/core
      - run: node --import tsx --test packages/tools/src/families/web/fetch_runtime_regression.test.ts packages/tools/src/families/web/web_destination_regression.test.ts

  typecheck:
    name: Typecheck
    # Keep browser fixture dependencies on a Playwright-supported runner image.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build compiled packages
        run: |
          npm run build -w @liminal/core
          npm run build -w @liminal/protocol
          npm run build -w @liminal/tools
          npm run build -w @liminal/sidecar

      - name: Typecheck all workspaces
        run: npm run typecheck

      - name: Test local audio routing and playback cache (no model download)
        run: |
          node --import tsx --test packages/core/src/local_speech.test.ts packages/tools/src/families/audio/tts_clips.test.ts packages/tools/src/families/audio/audio_cancellation.test.ts packages/sidecar/src/audio_http.test.ts packages/sidecar/src/voice_send_admission.test.ts packages/web/server/local_voice_routes.test.ts packages/core/src/local_transcription.test.ts packages/core/src/transcription_warmup.test.ts packages/core/src/local_audio_runtime.test.ts packages/web/client/audio/localPreview.test.ts packages/web/client/audio/dictationMessage.test.ts packages/web/client/audio/dictationRecovery.test.mjs packages/web/server/local_transcription_routes.test.ts packages/core/src/transcription_override_review.test.ts packages/tools/src/families/audio/transcription_language_review.test.ts scripts/asr_api_docs_review.test.mjs packages/tools/src/families/audio/transcription_status_review.test.ts packages/web/client/settings/customAsrModel.test.ts scripts/asr_release_link_review.test.mjs
          node --test packages/core/local-voice/setup.test.mjs packages/core/local-asr/setup.test.mjs packages/core/local-asr/install_lock.test.mjs packages/core/local-asr/shutdown_review.test.mjs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test terminal voice status over WebSocket and SSE
        run: node --import tsx --test packages/sidecar/src/voice_idle_heartbeat.test.ts packages/sidecar/src/voice_preflight_review.test.ts packages/web/server/voice_idle_heartbeat.test.ts

      - name: Test wake voice, local audio handoffs and responsive Mission Control
        run: |
          node --import tsx --test packages/core/src/wake_voice.test.ts packages/core/src/local_audio_parking.test.ts packages/tools/src/families/audio/wake_audio.test.ts packages/sidecar/src/wake_orchestrator.test.ts
          python -B packages/core/local-voice/test_parking.py

      - name: Test original-pitch warm tone (no speech model required)
        run: |
          python -m pip install numpy==1.26.4 scipy==1.17.1 pyloudnorm==0.2.0
          python -B packages/core/test/local_voice_tone.py

      - name: Test local transcription speech gating (no ASR weights)
        run: |
          python -m pip install faster-whisper==1.2.1 ctranslate2==4.8.5
          python -B packages/core/local-asr/test_worker.py

      - name: Test OAuth connection recovery
        run: npm run test:oauth

      - name: Install Chromium for local browser fixtures
        run: npm exec --workspace=@liminal/tools -- playwright install --with-deps chromium

      - name: Test browser, setup and conversation updates (offline fixtures)
        env:
          AGENT_BROWSER_INTEGRATION: "1"
        run: |
          node --import tsx --test --test-concurrency=4 packages/core/src/native_vision.test.ts packages/core/src/native_image_context.test.ts packages/core/src/account_directory.test.ts packages/tools/src/families/browser/browser_accounts.test.ts packages/tools/src/families/browser/browser_action_contract.test.ts packages/tools/src/families/browser/browser_authentication_context.test.ts packages/tools/src/families/browser/browser_copy_feedback.test.ts packages/tools/src/families/browser/browser_credential_contract.test.ts packages/tools/src/families/browser/browser_demo_flow.test.ts packages/tools/src/integrations/external_api/mcp_builtin_lookup.test.ts packages/tools/src/families/browser/browser_native_images.test.ts packages/tools/src/families/browser/browser_interaction_regression.test.ts packages/tools/src/families/browser/browser_click_position.test.ts packages/tools/src/families/browser/browser_scroll.test.ts packages/tools/src/families/browser/browser_wait_observation.test.ts packages/tools/src/families/browser/browser_visual_challenge.test.ts packages/tools/src/families/browser/browser_metadata_capacity.test.ts packages/tools/src/families/browser/browser_frame_feedback.test.ts packages/tools/src/families/browser/browser_hold.test.ts packages/tools/src/families/browser/browser_verification.test.ts packages/tools/src/families/browser/captcha_solve.test.ts packages/tools/src/families/browser/captcha_browser.test.ts packages/tools/src/families/browser/browser_context.test.ts packages/tools/src/families/browser/browser_efficiency.test.ts packages/tools/src/families/browser/browser_navigation_context.test.ts packages/sidecar/src/chat_focus_request.test.ts packages/sidecar/src/persona_shared_setup.test.ts packages/sidecar/src/completion_boundary.test.ts packages/web/server/completion_boundary.test.ts packages/web/server/persona_shared_setup.test.ts packages/tools/src/families/harness_ui/persona_generator.test.ts packages/tools/src/families/harness_ui/persona_runtime.test.ts packages/tools/src/families/browser/browser_findings.test.ts packages/tools/src/families/browser/browser_idle.test.ts packages/tools/src/families/browser/browser_readable.test.ts packages/tools/src/families/browser/browser_research.test.ts packages/tools/src/families/browser/browser_signup.test.ts packages/tools/src/families/browser/browser_workspace.test.ts packages/tools/src/families/files/file_version.test.ts packages/tools/src/families/harness_ui/persona_transaction.test.ts packages/sidecar/src/browser_workspace_handler.test.ts packages/sidecar/src/chat_ordering_regression.test.ts packages/sidecar/src/wake_config_scope.test.ts packages/web/server/chat_ordering.test.ts

      - name: Test verified procedures and bounded experiment controls
        run: |
          node --import tsx --test packages/tools/src/families/memory/procedure_memory.test.ts packages/eval/src/procedural/learning_gate.test.ts
          node --test scripts/experiment-procedural-memory-live.test.mjs scripts/procedure-oracle.test.mjs
          node scripts/verify-procedure-native-runtime.mjs

      - name: Test MCP Gmail contracts
        run: node --import tsx --test packages/tools/src/integrations/external_api/gmail_mcp_contract.test.ts packages/tools/src/integrations/external_api/mcp_tool_classify.test.ts packages/tools/src/integrations/external_api/mcp_description_write_regression.test.ts packages/tools/src/integrations/external_api/mcp_compound_action_regression.test.ts packages/tools/src/integrations/google/gmail_compose_guard.test.ts

      - name: Test file content is not mistaken for outbound mail
        run: node --import tsx --test packages/tools/src/families/files/email_file_false_positive.test.ts

      - name: Test artifact inspection and tool activation
        run: node --import tsx --test packages/tools/src/tool_activation.test.ts packages/tools/src/families/files/file_metadata.test.ts packages/tools/src/families/files/iso9660.test.ts packages/tools/src/families/files/read_binary.test.ts packages/tools/src/families/files/list_dir.test.ts packages/tools/src/families/files/recursive_name_table.test.ts packages/tools/src/families/files/recursive_archive_reference.test.ts packages/tools/src/families/files/native_header_tools.test.ts packages/tools/src/families/memory/read_artifact_json.test.ts packages/tools/src/families/code_intel/execute_code.test.ts

      - name: Test explicit REA compatibility repair
        run: |
          node --test scripts/rea-ida-backend/health-readiness.test.mjs scripts/rea-ida-backend/repair.test.mjs scripts/rea-ida-backend/coverage-cleanup.test.mjs scripts/rea-ida-backend/mips-profile.test.mjs scripts/rea-ida-backend/cleanup-settlement.test.mjs scripts/rea-ida-backend/provider-guard.test.mjs
          python -B -m unittest discover -s scripts/rea-ida-backend -p test_headless_health.py

      - name: Test Google helper permits desktop updates
        run: node --import tsx --test packages/tools/src/integrations/google/google_sidecar_update_lock.test.ts

      - name: Test native local MCP tool catalogs and lifecycle
        run: node --import tsx --test packages/tools/src/integrations/external_api/mcp_stdio.test.ts packages/tools/src/integrations/external_api/mcp_catalog.test.ts packages/tools/src/integrations/external_api/mcp_guidance_search.test.ts packages/tools/src/integrations/external_api/mcp_transport_fidelity.test.ts

      - name: Test desktop update installation and rollback
        run: npm run test:update-release

      - name: Verify guided workflow gates and exports
        run: npm run verify:workflows

      - name: Test review repair evidence gates
        run: npm run test:review-loop

      - name: Test confirmed review regressions
        run: npm run test:review-regressions

      - name: Test eval fixtures and trace handling
        run: npm run test:sandbox -w @liminal/eval

      - name: Test chronological web chat layout
        run: node --import tsx --test packages/web/client/chatTurnLayout.test.ts

      - name: Build web client (check browser-safe imports)
        run: npm run build:client -w @liminal/web

  test-core:
    name: Test packages/core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build core
        run: npm run build -w @liminal/core

      - name: Run tests
        run: npm run test -w @liminal/core

  verify-harness-defaults:
    name: Verify harness defaults
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build core
        run: npm run build -w @liminal/core

      - name: Verify no secrets in defaults
        run: npm run verify-harness-defaults-no-secrets

  test-desktop:
    name: Test desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          channel: stable
          cache: true
      - name: Run desktop tests
        working-directory: apps/liminal_desktop
        run: flutter test

  test-windows-terminal:
    name: Windows terminal and workflow gates
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Test OAuth connection recovery on Windows
        run: npm run test:oauth

      - name: Test MCP Gmail contracts on Windows
        run: node --import tsx --test packages/core/src/mcp_schema_contract_regression.test.ts packages/core/src/mcp_integer_union_regression.test.ts packages/tools/src/integrations/external_api/gmail_mcp_contract.test.ts packages/tools/src/integrations/external_api/mcp_tool_classify.test.ts packages/tools/src/integrations/external_api/mcp_description_write_regression.test.ts packages/tools/src/integrations/external_api/mcp_compound_action_regression.test.ts packages/tools/src/integrations/google/gmail_compose_guard.test.ts

      - name: Test file content is not mistaken for outbound mail on Windows
        run: node --import tsx --test packages/tools/src/families/files/email_file_false_positive.test.ts

      - name: Test artifact inspection and tool activation on Windows
        run: node --import tsx --test packages/tools/src/tool_activation.test.ts packages/tools/src/families/files/file_metadata.test.ts packages/tools/src/families/files/iso9660.test.ts packages/tools/src/families/files/read_binary.test.ts packages/tools/src/families/files/list_dir.test.ts packages/tools/src/families/files/recursive_name_table.test.ts packages/tools/src/families/files/recursive_archive_reference.test.ts packages/tools/src/families/files/native_header_tools.test.ts packages/tools/src/families/memory/read_artifact_json.test.ts packages/tools/src/families/code_intel/execute_code.test.ts

      - name: Test artifact reasoning and persistence on Windows
        run: node --import tsx --test packages/core/src/artifact_completion_regression.test.ts packages/core/src/artifact_reasoning_regression.test.ts packages/core/src/artifact_investigation.test.ts packages/core/src/binary_format_header.test.ts packages/core/src/native_binary_header.test.ts packages/core/src/artifact_json_view.test.ts packages/core/src/mcp_output_view.test.ts packages/core/src/mcp_local_ref_regression.test.ts

      - name: Test explicit REA compatibility repair on Windows
        run: |
          node --test scripts/rea-ida-backend/health-readiness.test.mjs scripts/rea-ida-backend/repair.test.mjs scripts/rea-ida-backend/coverage-cleanup.test.mjs scripts/rea-ida-backend/mips-profile.test.mjs scripts/rea-ida-backend/cleanup-settlement.test.mjs scripts/rea-ida-backend/provider-guard.test.mjs
          python -B -m unittest discover -s scripts/rea-ida-backend -p test_headless_health.py

      - name: Test live Google helper permits Windows folder swaps
        run: node --import tsx --test packages/tools/src/integrations/google/google_sidecar_update_lock.test.ts

      - name: Test local MCP process isolation and cancellation on Windows
        run: node --import tsx --test packages/tools/src/integrations/external_api/mcp_stdio.test.ts packages/tools/src/integrations/external_api/mcp_catalog.test.ts packages/tools/src/integrations/external_api/mcp_guidance_search.test.ts packages/tools/src/integrations/external_api/mcp_transport_fidelity.test.ts
      - name: Verify workflow gates with actual Windows test processes
        run: npm run verify:workflows
      - name: Test Windows update helper and rollback
        run: npm run test:update-release
      - name: Test procedure persistence and Windows worker launch
        run: |
          npm run test:procedures -w @liminal/core
          node --import tsx --test packages/core/src/python_worker_process.test.ts packages/sidecar/src/wake_config_scope.test.ts
      - name: Verify terminal replay, output, and cleanup
        timeout-minutes: 3
        run: node --import tsx --test packages/sidecar/src/pty_manager.test.ts packages/sidecar/src/desktop_parent_regression.test.ts packages/sidecar/src/foreground_shell_regression.test.ts packages/sidecar/src/powershell_module_path_regression.test.ts packages/sidecar/src/foreground_cancellation_regression.test.ts packages/tools/src/families/shell/foreground_output_retention.test.ts
